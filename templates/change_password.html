{% extends "base.html" %}
{% block title %}Change Password | File Manager{% endblock %}
{% block content %}
<section class="card auth-card pop-in">
  <div class="title-row">
    <span class="title-icon">🔑</span>
    <div>
      <h1>Change admin password</h1>
      <p class="muted">Update your login to protect server files.</p>
    </div>
  </div>

  <form method="post" class="form-grid">
    <label for="current_password">Current password</label>
    <input id="current_password" name="current_password" type="password" required />

    <label for="new_password">New password</label>
    <input id="new_password" name="new_password" type="password" minlength="4" required />

    <label for="confirm_password">Confirm new password</label>
    <input id="confirm_password" name="confirm_password" type="password" minlength="4" required />

    <button type="submit" class="cta">Update Password</button>
  </form>
  <a class="back-link" href="{{ url_for('dashboard') }}">← Back to dashboard</a>
</section>
{% endblock %}
